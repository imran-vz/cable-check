[package]
name = "cable-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Find out what your USB-C cables can really do: a macOS cable tester and drive speed test"
repository = "https://github.com/imran-vz/cable-check"
readme = "README.md"
keywords = ["usb-c", "thunderbolt", "cable", "macos", "benchmark"]
categories = ["hardware-support"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ea6ddf8f2c3cd476a3797caad7d77cbe04641d9c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
time = "0.3"

[dev-dependencies]
tempfile = "3"
